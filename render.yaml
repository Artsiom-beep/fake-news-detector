services:
  - type: web
    name: fake-news-detector-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FACTCHECK_CORS_ORIGINS
        value: "*"
      - key: FACTCHECK_AI_IMAGE_MODEL
        value: metadata_only
      - key: FACTCHECK_NLI_MODEL
        value: Xenova/mobilebert-uncased-mnli
      - key: FACTCHECK_NLI_BACKEND
        value: onnx
      - key: FACTCHECK_NLI_ONNX_FILE
        value: onnx/model_quantized.onnx
      - key: FACTCHECK_MAX_NLI_CALLS
        value: "6"
      - key: FACTCHECK_MAX_PASSAGES_PER_DOCUMENT
        value: "3"
      - key: FACTCHECK_MAX_SEARCH_RESULTS
        value: "6"
      - key: FACTCHECK_MAX_DOCUMENTS
        value: "6"
      - key: FACTCHECK_MAX_EVIDENCE
        value: "5"
