seed: 42
device: cpu

paths:
  train_csv: data/news/train.csv
  val_csv: data/news/val.csv
  test_csv: data/news/test.csv

model:
  text_model_name: distilbert-base-uncased
  max_text_len: 256
  image_size: 224
  video_frames: 8
  fusion_hidden: 256
  dropout: 0.2
  text_only: true
  train_max_samples: 8000
  val_max_samples: 1500
  test_max_samples: 1500

train:
  batch_size: 4
  epochs: 3
  lr: 2e-4
  weight_decay: 1e-4
  num_workers: 0
  patience: 2
  save_path: outputs/model_news.pt
  metrics_json: outputs/metrics_news.json
  confusion_csv: outputs/confusion_matrix_news.csv
