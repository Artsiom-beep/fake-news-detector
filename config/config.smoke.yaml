seed: 42
device: cpu

paths:
  train_csv: data/liar/train.csv
  val_csv: data/liar/val.csv
  test_csv: data/liar/test.csv

model:
  text_model_name: distilbert-base-uncased
  max_text_len: 256
  image_size: 224
  video_frames: 8
  fusion_hidden: 256
  dropout: 0.2
  text_only: true
  train_max_samples: 120
  val_max_samples: 120
  test_max_samples: 120

train:
  batch_size: 4
  epochs: 1
  lr: 2e-4
  weight_decay: 1e-4
  num_workers: 0
  patience: 2
  save_path: outputs/model.pt
  metrics_json: outputs/metrics.json
  confusion_csv: outputs/confusion_matrix.csv


