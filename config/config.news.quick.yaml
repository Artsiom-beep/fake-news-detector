seed: 42
device: cpu

paths:
  train_csv: data/news/train.csv
  val_csv: data/news/val.csv
  test_csv: data/news/test.csv

model:
  text_model_name: distilbert-base-uncased
  max_text_len: 128
  image_size: 224
  video_frames: 8
  fusion_hidden: 256
  dropout: 0.2
  text_only: true
  train_max_samples: 1200
  val_max_samples: 300
  test_max_samples: 300

train:
  batch_size: 16
  epochs: 1
  lr: 2e-4
  weight_decay: 1e-4
  num_workers: 0
  patience: 1
  save_path: outputs/model_news_quick.pt
  metrics_json: outputs/metrics_news_quick.json
  confusion_csv: outputs/confusion_matrix_news_quick.csv
